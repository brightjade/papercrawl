name: Discover new conference papers

on:
  schedule:
    # 07:23 UTC on the 3rd of each month -- an odd minute and a non-1st day so
    # this does not pile onto the top-of-hour, start-of-month rush.
    - cron: "23 7 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Probe tracked venues
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        # One sweep, not two. Running `--json` and the table as separate
        # processes doubled request volume against DBLP, whose throttling
        # already cost this workflow a fix round, and let the two renderings
        # disagree inside a single issue body. The table is rendered from this
        # JSON by the step below.
        run: uv run ppr discover --json > results.json

      - name: Open, update or close the tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const LABEL = 'new-conferences';
            // Mirrors format_discover_table's ordering in ppr/discover.py.
            const STATUS_ORDER = { live: 0, 'needs-manual': 1, empty: 2, unreachable: 3, 'not-yet': 4 };
            const today = new Date().toISOString().slice(0, 10);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const data = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            const results = data.results || [];
            const withStatus = (s) => results.filter((r) => r.status === s);
            const live = withStatus('live');
            const manual = withStatus('needs-manual');
            const unreachable = withStatus('unreachable');
            const stale = data.stale_empty || [];

            const rows = [...results].sort(
              (a, b) =>
                (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9) ||
                a.conf_id.localeCompare(b.conf_id)
            );
            const report = [
              `${'Conference'.padEnd(24)} ${'Status'.padEnd(14)} ${'Papers'.padStart(7)}  URL`,
              '-'.repeat(100),
              ...rows.map((r) => {
                const count = r.count ? String(r.count) : '-';
                const note = r.note ? `  (${r.note})` : '';
                return `${r.conf_id.padEnd(24)} ${r.status.padEnd(14)} ${count.padStart(7)}  ${r.url}${note}`;
              }),
            ].join('\n');
            core.info(report);

            const existing = await github.rest.issues.listForRepo({
              ...repo, state: 'open', labels: LABEL,
            });

            // `needs-manual` is a standing state, not news: the registry yields
            // the same dozen rows every sweep (ACL 2026/2027, EMNLP, NAACL,
            // EACL x3, COLING, AAAI) because those venues will always need a
            // hand-written scraper. Triggering on it means run 1 opens an issue
            // and every later run takes the update branch -- and GitHub sends
            // no notification for a title or body edit, so a venue going live
            // in month 5 becomes silent text on a stale issue. Only genuinely
            // new findings trigger; needs-manual rides along in the body.
            const notify = live.length > 0 || stale.length > 0;

            if (!notify) {
              for (const issue of existing.data) {
                await github.rest.issues.createComment({
                  ...repo, issue_number: issue.number,
                  body: `Sweep on ${today} found nothing live and nothing stale. Closing — a new issue opens as soon as something turns up.`,
                });
                await github.rest.issues.update({
                  ...repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
              }
              core.info(`Nothing live, nothing stale. Closed ${existing.data.length} open issue(s).`);
              return;
            }

            const summary = [
              live.length
                ? `${live.length} new list(s) ready to register: ${live.map((r) => `${r.conf_id} (${r.count})`).join(', ')}`
                : '',
              stale.length
                ? `${stale.length} venue(s) past their announce month but parsing 0 papers: ${stale.join(', ')}`
                : '',
            ].filter(Boolean).join('\n');

            const title = live.length
              ? `New accepted-paper lists: ${live.map((r) => `${r.conf_id} (${r.count})`).join(', ')}`
              : `Possible broken selectors: ${stale.join(', ')}`;

            const body = [
              live.length
                ? `## Ready to register\n\n${live.map((r) => `- \`${r.conf_id}\` — ${r.count} papers — ${r.url}`).join('\n')}`
                : '',
              stale.length
                ? `## Past their announce month but parsing 0 papers\n\nLikely a selector the site outgrew, not an unpublished list. Worth checking by hand.\n\n${stale.map((c) => `- \`${c}\``).join('\n')}`
                : '',
              manual.length
                ? `## Need a hand-written scraper\n\nStanding state, listed for context — never the reason this issue exists.\n\n${manual.map((r) => `- \`${r.conf_id}\` — ${r.url}`).join('\n')}`
                : '',
              unreachable.length
                ? `## Not probed\n\n${unreachable.map((r) => `- \`${r.conf_id}\` — ${r.note}`).join('\n')}`
                : '',
              `## Full sweep (${today})\n\n\`\`\`\n${report}\n\`\`\``,
              `_Run \`/check-new-conferences\` in Claude Code to act on this._`,
            ].filter(Boolean).join('\n\n');

            if (existing.data.length) {
              const issue_number = existing.data[0].number;
              await github.rest.issues.update({ ...repo, issue_number, title, body });
              // Editing a title or body notifies nobody. The comment is the
              // only part of this branch that actually reaches a human, so a
              // venue that goes live months after the issue opened is not left
              // as silent text on something already read and dismissed.
              await github.rest.issues.createComment({
                ...repo, issue_number,
                body: `Sweep on ${today}:\n\n${summary}\n\nFull details in the issue body above.`,
              });
              core.info(`Updated and commented on issue #${issue_number}.`);
            } else {
              const created = await github.rest.issues.create({
                ...repo, title, body, labels: [LABEL],
              });
              core.info(`Opened issue #${created.data.number}.`);
            }
