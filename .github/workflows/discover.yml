name: Discover new conference papers

on:
  schedule:
    # 07:23 UTC on the 3rd of each month -- an odd minute and a non-1st day so
    # this does not pile onto the top-of-hour, start-of-month rush.
    - cron: "23 7 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Probe tracked venues
        id: probe
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: |
          uv run ppr discover --json > results.json
          uv run ppr discover > report.txt
          cat report.txt

      - name: Open or update an issue when something is live
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            const report = fs.readFileSync('report.txt', 'utf8');
            const live = data.results.filter(r => r.status === 'live');
            const manual = data.results.filter(r => r.status === 'needs-manual');
            const stale = data.stale_empty || [];
            const unreachable = data.results.filter(r => r.status === 'unreachable');
            if (live.length === 0 && manual.length === 0 && stale.length === 0) {
              core.info('Nothing new. No issue created.');
              return;
            }

            const title = live.length
              ? `New accepted-paper lists: ${live.map(r => `${r.conf_id} (${r.count})`).join(', ')}`
              : manual.length
              ? `Venues needing a scraper: ${manual.map(r => r.conf_id).join(', ')}`
              : `Possible broken selectors: ${stale.join(', ')}`;
            const body = [
              live.length ? `## Ready to register\n\n${live.map(r => `- \`${r.conf_id}\` — ${r.count} papers — ${r.url}`).join('\n')}` : '',
              manual.length ? `## Need a hand-written scraper\n\n${manual.map(r => `- \`${r.conf_id}\` — ${r.url}`).join('\n')}` : '',
              stale.length ? `## Past their announce month but parsing 0 papers\n\nLikely a selector the site outgrew, not an unpublished list. Worth checking by hand.\n\n${stale.map(c => `- \`${c}\``).join('\n')}` : '',
              unreachable.length ? `## Not probed\n\n${unreachable.map(r => `- \`${r.conf_id}\` — ${r.note}`).join('\n')}` : '',
              `## Full sweep\n\n\`\`\`\n${report}\n\`\`\``,
              `_Run \`/check-new-conferences\` in Claude Code to act on this._`,
            ].filter(Boolean).join('\n\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'new-conferences',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['new-conferences'],
              });
            }
